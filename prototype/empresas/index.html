<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23171717%27/%3E%3Ctext x=%2712%27 y=%2716.5%27 font-family=%27Arial%2C sans-serif%27 font-size=%278%27 font-weight=%27700%27 fill=%27%23fafafa%27 text-anchor=%27middle%27%3EAP%3C/text%3E%3C/svg%3E" />
  <title>Empresas — AutoPilot</title>
  <link rel="stylesheet" href="../shared/css/tokens.css" />
  <link rel="stylesheet" href="../shared/css/base.css" />
  <link rel="stylesheet" href="../shared/css/components.css" />
  <link rel="stylesheet" href="../shared/css/layout.css" />
</head>
<body>
  <div id="shell-root"></div>

  <template id="page-content">
    <section class="max-w-7xl flex flex-col gap-4">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <h1 class="text-xl font-semibold mb-1">Empresas</h1>
          <p class="text-sm text-muted max-w-xl">
            Cadastro completo por empresa.
          </p>
        </div>
        <a href="importar.html" class="btn btn-outline btn-sm w-fit" id="btn-importar-empresas">::icon-upload:: Importar empresas</a>
      </div>

      <div class="flex flex-wrap items-end justify-between gap-3">
        <div class="flex flex-wrap items-end gap-3">
          <div class="flex flex-col gap-1">
            <label class="field-label">Pesquisar</label>
            <input id="f-busca" class="field-input w-72" placeholder="Pesquisar empresa, código ou CNPJ" />
          </div>
          <div class="flex flex-col gap-1">
            <label class="field-label">Status</label>
            <div class="toggle-group" id="f-status">
              <button type="button" class="toggle-item is-on" data-value="todas">Todas</button>
              <button type="button" class="toggle-item" data-value="ativo">Ativas</button>
              <button type="button" class="toggle-item" data-value="inativo">Inativas</button>
            </div>
          </div>
          <div class="flex flex-col gap-1">
            <label class="field-label">Tipo</label>
            <div class="toggle-group" id="f-tipo">
              <button type="button" class="toggle-item is-on" data-value="todos">Todas</button>
              <button type="button" class="toggle-item" data-value="matriz">Matrizes</button>
              <button type="button" class="toggle-item" data-value="filial">Filiais</button>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <label class="field-label">Ordenar por</label>
          <div class="field-select-wrap w-52">
            <select id="f-ordenar" class="field-select">
              <option value="empresa">Empresa</option>
              <option value="codigo">Código</option>
              <option value="cnpj">CNPJ</option>
              <option value="responsavel">Contador responsável</option>
            </select>
            <span class="chev">::chevron-down::</span>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table class="dtable dtable-fixed" id="tabela-empresas">
          <colgroup id="tabela-empresas-colgroup"></colgroup>
          <thead>
            <tr>
              <th class="col-pad-sm">Código</th>
              <th>Empresa</th>
              <th class="col-pad-md">CNPJ</th>
              <th class="col-pad-md">Contador responsável</th>
              <th class="col-pad-sm">Status</th>
              <th class="col-pad-end"></th>
            </tr>
          </thead>
          <tbody id="tabela-empresas-body"></tbody>
        </table>
      </div>

      <button type="button" class="btn btn-ghost btn-sm w-fit" id="btn-mostrar-mais" style="display:none;">Mostrar mais</button>
    </section>
  </template>

  <script src="../shared/js/icons.js"></script>
  <script src="../shared/js/shell.js"></script>
  <script src="../shared/js/ui.js"></script>
  <script src="../shared/js/fab-tools.js"></script>
  <script src="js/data.js"></script>
  <script src="../cadastros-auxiliares/js/contadores/data.js"></script>
  <script>
    Shell.mount(document.getElementById("shell-root"), { base: "../", active: "empresas", crumb: "empresas" });
    // troca placeholder do select nativo pelo ícone real (o texto "::chevron-down::" foi só reserva de espaço no template)
    document.querySelector(".field-select-wrap .chev").innerHTML = Icon("chevron-down", "size-4");
    document.getElementById("btn-importar-empresas").innerHTML = Icon("upload", "size-4") + " Importar empresas";
  </script>
  <script src="js/list.js"></script>
</body>
</html>
