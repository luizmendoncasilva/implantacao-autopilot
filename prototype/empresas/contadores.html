<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contadores · Empresas · Autopilot Configs</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { margin: 0; }
.ap-crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-tertiary);}
.ap-crumb a{color:var(--text-tertiary);text-decoration:none;}
.ap-crumb a:hover{color:var(--brand-pink);}
.ap-page{padding:20px 28px 48px;max-width:1200px;margin:0 auto;width:100%;}
.ap-btn-link{background:none;border:none;padding:0;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--brand-blue);}
.ap-btn-link.danger{color:var(--danger);}
.ap-toast{position:fixed;bottom:24px;right:24px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.14);padding:14px 16px;display:flex;gap:10px;align-items:flex-start;max-width:360px;z-index:400;transform:translateY(12px);opacity:0;pointer-events:none;transition:all .2s;}
.ap-toast.show{transform:translateY(0);opacity:1;}
.ap-toast-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--success-soft);color:var(--success);}
.ap-toast.info .ap-toast-icon{background:var(--info-soft);color:var(--info);}
.ap-toast-title{font-size:13px;font-weight:600;color:var(--text-primary);}
.ap-toast-desc{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:140;opacity:0;pointer-events:none;transition:opacity .2s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;height:100%;width:480px;background:var(--surface);border-left:1px solid var(--border);z-index:150;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.25,.46,.45,.94);}
.drawer.open{transform:translateX(0);}
.drawer-header{padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:flex-start;gap:12px;}
.drawer-title{font-size:15px;font-weight:700;color:var(--text-primary);line-height:1.3;}
.drawer-desc{font-size:12.5px;color:var(--text-secondary);margin-top:4px;}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:16px;}
.drawer-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--surface);}
.ap-topbar-inner{display:flex;align-items:center;height:56px;padding:0 28px;border-bottom:1px solid var(--border);background:#fff;}
</style>
</head>
<body>

<div class="sidebar"></div>
<div class="main">
  <div class="ap-topbar-inner" id="ap-crumb"></div>
  <div class="ap-page" id="ap-empresa-shell"></div>
</div>

<!-- Drawer: Vincular contador -->
<div class="drawer-overlay" id="ct-overlay"></div>
<div class="drawer" id="ct-panel">
  <div class="drawer-header">
    <div style="flex:1;">
      <div class="drawer-title">Vincular contador</div>
      <div class="drawer-desc">Vincula um contador já cadastrado no Registro de Contadores a esta empresa.</div>
    </div>
    <button type="button" class="btn btn-ghost" id="ct-close"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
  </div>
  <div class="drawer-body">
    <div class="ef-field"><label class="ef-label">Contador</label><select class="ef-select" id="ct-select"></select></div>
  </div>
  <div class="drawer-footer">
    <button type="button" class="btn btn-secondary" id="ct-cancelar">Cancelar</button>
    <button type="button" class="btn btn-primary" id="ct-salvar" disabled>Vincular</button>
  </div>
</div>

<div id="ap-toast" class="ap-toast">
  <span class="ap-toast-icon"><i data-lucide="check" style="width:12px;height:12px;"></i></span>
  <div><div class="ap-toast-title"></div><div class="ap-toast-desc"></div></div>
</div>

<script>window.FLOW_CONFIG = { standalone: true };</script>
<script src="js/data.js"></script>
<script src="../cadastros-auxiliares/js/contadores/data.js"></script>
<script src="../assets/core/cockpit-01-shell.js"></script>
<script src="../assets/core/cockpit-02-state-helpers.js"></script>
<script src="../assets/core/cockpit-05-timeline-actions.js"></script>
<script src="../assets/core/cockpit-08-datatable.js"></script>
<script src="../assets/core/cockpit-07-modals-init.js"></script>
<script src="../assets/core/cockpit-09-cx-sidebar.js"></script>
<script src="js/empresa-shell-cockpit.js"></script>
<script>
(function () {
  const D = window.ContadoresData;
  let empresaAtual = null;

  function contadoresDaEmpresa() { return D.getContadores().filter((c) => c.empresasAtendidas.includes(empresaAtual.codigo)); }

  function renderTabela() {
    const contadores = contadoresDaEmpresa();
    const rows = contadores.length === 0
      ? '<tr><td colspan="4"><div class="dt-empty">Nenhum contador vinculado a esta empresa ainda.</div></td></tr>'
      : contadores.map((c) =>
          "<tr><td>" + esc(c.nome) + '</td><td class="dt-td-mono">' + c.cpf + "</td><td>" + c.crc + '</td><td><button type="button" class="ap-btn-link danger" data-desvincular="' + c.id + '">desvincular</button></td></tr>'
        ).join("");

    document.getElementById("tab-content").innerHTML =
      '<div class="section-card">' +
      '<div class="flex items-center justify-between flex-wrap gap-3" style="margin-bottom:18px;">' +
      '<div><div class="subsection-title" style="margin:0;border:none;padding:0;">Contadores</div><p style="font-size:12.5px;color:var(--text-secondary);margin:4px 0 0;">Contadores habilitados a assinar demonstrativos desta empresa — referencia o Registro de Contadores.</p></div>' +
      '<button type="button" class="btn btn-secondary" id="btn-add-contador"><i data-lucide="plus" style="width:13px;height:13px;"></i> Vincular contador</button>' +
      "</div>" +
      '<div class="dt-wrap"><div class="dt-scroll"><table class="dt-table"><thead><tr><th>Nome</th><th>CPF</th><th>CRC</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div></div>" +
      "</div>";

    document.getElementById("btn-add-contador").addEventListener("click", abrirVincular);
    document.querySelectorAll("[data-desvincular]").forEach((btn) => btn.addEventListener("click", () => confirmarDesvinculo(Number(btn.getAttribute("data-desvincular")))));
    refreshIcons();
  }

  function confirmarDesvinculo(contadorId) {
    const contador = D.getContadores().find((c) => c.id === contadorId);
    showConfirmModal({
      title: "Remover vínculo do contador?",
      message: "O vínculo de " + esc(contador.nome) + " com " + esc(empresaAtual.nome) + " será removido. O contador continua cadastrado no Registro de Contadores e mantém seus vínculos com outras empresas.",
      confirmLabel: "Remover vínculo",
      danger: true,
      onConfirm: () => {
        const atualizados = D.getContadores().map((c) =>
          c.id !== contadorId ? c : Object.assign({}, c, { empresasAtendidas: c.empresasAtendidas.filter((codigo) => codigo !== empresaAtual.codigo) })
        );
        D.setContadores(atualizados);
        window.EmpresasData.registrarEventoHistorico(empresaAtual.codigo, [{ campo: "Contador desvinculado", de: contador.nome + " — " + contador.crc, para: "—" }]);
        renderTabela();
        ApEmpresaShell.toast("Vínculo removido", "O contador foi desvinculado de " + empresaAtual.nome + ".", "info");
      },
    });
  }

  function contadorOptions() { return D.getContadores().filter((c) => !c.empresasAtendidas.includes(empresaAtual.codigo)).map((c) => ({ value: String(c.id), label: c.nome + " — " + c.cpf })); }

  let currentContadorId = "";
  function abrirVincular() {
    currentContadorId = "";
    const opts = contadorOptions();
    const sel = document.getElementById("ct-select");
    sel.innerHTML = opts.length
      ? '<option value="">Selecione um contador...</option>' + opts.map((o) => '<option value="' + o.value + '">' + esc(o.label) + "</option>").join("")
      : '<option value="">Todos os contadores do registro já estão vinculados a esta empresa.</option>';
    document.getElementById("ct-salvar").disabled = true;
    ApEmpresaShell.abrirDrawer("ct-overlay", "ct-panel");
  }
  function fecharVincular() { ApEmpresaShell.fecharDrawer("ct-overlay", "ct-panel"); }

  function salvarVinculo() {
    if (!currentContadorId) return;
    const contador = D.getContadores().find((c) => String(c.id) === currentContadorId);
    const atualizados = D.getContadores().map((c) => String(c.id) === currentContadorId ? Object.assign({}, c, { empresasAtendidas: c.empresasAtendidas.concat([empresaAtual.codigo]) }) : c);
    D.setContadores(atualizados);
    window.EmpresasData.registrarEventoHistorico(empresaAtual.codigo, [{ campo: "Contador vinculado", de: "—", para: contador.nome + " — " + contador.crc }]);
    fecharVincular();
    renderTabela();
    ApEmpresaShell.toast("Contador vinculado", "O contador foi vinculado a " + empresaAtual.nome + ".");
  }

  window.renderTabContent = function (empresa) {
    empresaAtual = empresa;
    renderTabela();
    document.getElementById("ct-select").onchange = (e) => { currentContadorId = e.target.value; document.getElementById("ct-salvar").disabled = !e.target.value; };
    document.getElementById("ct-overlay").addEventListener("click", fecharVincular);
    document.getElementById("ct-close").addEventListener("click", fecharVincular);
    document.getElementById("ct-cancelar").addEventListener("click", fecharVincular);
    document.getElementById("ct-salvar").addEventListener("click", salvarVinculo);
  };

  ApEmpresaShell.boot("contadores");
})();
</script>
</body>
</html>
