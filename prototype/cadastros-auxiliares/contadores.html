<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23171717%27/%3E%3Ctext x=%2712%27 y=%2716.5%27 font-family=%27Arial%2C sans-serif%27 font-size=%278%27 font-weight=%27700%27 fill=%27%23fafafa%27 text-anchor=%27middle%27%3EAP%3C/text%3E%3C/svg%3E" />
  <title>Registro de Contadores — Cadastros Auxiliares — AutoPilot</title>
  <link rel="stylesheet" href="../shared/css/tokens.css" />
  <link rel="stylesheet" href="../shared/css/base.css" />
  <link rel="stylesheet" href="../shared/css/components.css" />
  <link rel="stylesheet" href="../shared/css/layout.css" />
</head>
<body>
  <div id="shell-root"></div>

  <template id="page-content">
    <div id="tabs-shell-mount"></div>

    <section class="max-w-7xl flex flex-col gap-4">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <h1 class="text-xl font-semibold mb-1">Registro de Contadores</h1>
          <p class="text-sm text-muted max-w-xl">
            Cadastro único de contadores habilitados a atender uma ou mais empresas.
          </p>
        </div>
        <button type="button" class="btn btn-sm w-fit" id="btn-novo-contador"><span id="icon-plus"></span> Novo contador</button>
      </div>

      <div class="flex flex-wrap items-end gap-3">
        <div class="flex flex-col gap-1">
          <label class="field-label">Nome</label>
          <input id="f-nome" class="field-input w-72" placeholder="Pesquisar por nome" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="field-label">CPF</label>
          <input id="f-cpf" class="field-input w-52" placeholder="Pesquisar por CPF" />
        </div>
      </div>

      <div class="table-wrap">
        <table class="dtable dtable-fixed" id="tabela-contadores">
          <colgroup>
            <col />
            <col style="width:170px" />
            <col style="width:160px" />
            <col style="width:180px" />
            <col style="width:40px" />
          </colgroup>
          <thead>
            <tr>
              <th>Nome</th>
              <th class="col-pad-md">CPF</th>
              <th class="col-pad-md">CRC</th>
              <th class="col-pad-md">Empresas vinculadas</th>
              <th class="col-pad-end"></th>
            </tr>
          </thead>
          <tbody id="tabela-contadores-body"></tbody>
        </table>
      </div>
    </section>
  </template>

  <!-- Sheet (drawer) de contador — aberto pela seta da linha (novo/existente);
       um único painel sempre editável, sem alternância visualizar/editar
       (mesmo padrão do Cadastro de Sócios). -->
  <div class="sheet-overlay" id="contador-overlay"></div>
  <div class="sheet-panel" id="contador-panel" role="dialog" aria-modal="true" aria-labelledby="contador-title">
    <button type="button" class="sheet-close" id="contador-close"></button>
    <div class="sheet-header">
      <div class="sheet-title" id="contador-title">Novo contador</div>
      <div class="sheet-description">Cadastro único de contador — reutilizado por todas as empresas onde o contador for vinculado.</div>
    </div>
    <div class="sheet-body">
      <div class="sheet-field">
        <label class="field-label" for="contador-nome">Nome completo <span class="text-muted">*</span></label>
        <input id="contador-nome" class="field-input" placeholder="Nome completo do contador" />
      </div>
      <div class="sheet-field">
        <label class="field-label" for="contador-cpf">CPF <span class="text-muted">*</span></label>
        <input id="contador-cpf" class="field-input" placeholder="000.000.000-00" maxlength="14" />
        <span class="text-xs" id="contador-cpf-erro" style="display:none; color:var(--destructive);">Já existe um contador cadastrado com este CPF.</span>
      </div>
      <div class="sheet-field">
        <label class="field-label" for="contador-crc">CRC <span class="text-muted">*</span></label>
        <input id="contador-crc" class="field-input" placeholder="0SP000000/O-0" />
      </div>
      <div class="sheet-field" id="contador-grupo-empresas" style="display:none;">
        <label class="field-label">Empresas vinculadas</label>
        <div class="flex flex-col gap-2" id="contador-empresas-lista"></div>
      </div>
    </div>
    <div class="sheet-footer">
      <button type="button" class="btn btn-outline" id="contador-cancelar">Cancelar</button>
      <button type="button" class="btn" id="contador-salvar" disabled>Salvar</button>
    </div>
  </div>

  <script src="../shared/js/icons.js"></script>
  <script src="../shared/js/shell.js"></script>
  <script src="../shared/js/ui.js"></script>
  <script src="../shared/js/fab-tools.js"></script>
  <script src="../empresas/js/data.js"></script>
  <script src="js/contadores/data.js"></script>
  <script src="js/tabs-common.js"></script>
  <script>
    Shell.mount(document.getElementById("shell-root"), {
      base: "../",
      active: "cadastros-auxiliares",
      crumbs: [{ label: "cadastros auxiliares", href: "socios.html" }, { label: "registro de contadores" }],
    });
    CadastrosAuxiliaresShell.mount("tabs-shell-mount", "contadores");
  </script>
  <script src="js/contadores/list.js"></script>
</body>
</html>
