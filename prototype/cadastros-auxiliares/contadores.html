<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro de Contadores — Cadastros Auxiliares — AutoPilot</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--surface-muted); }

  .aux-page-wrap { max-width: 1200px; margin: 0 auto; padding: 32px 32px 64px; width: 100%; }

  /* Rótulo + abas do módulo "Cadastros Auxiliares" (equivalente ao antigo
     tabs-common.js) — pill simples nos tokens do Cockpit. */
  .aux-tabs-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); }
  .aux-tabs-list { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-top: 8px; }
  .aux-tab { padding: 9px 4px; margin-right: 22px; font-size: 13.5px; font-weight: 500; color: var(--text-secondary); text-decoration: none; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
  .aux-tab:hover { color: var(--text-primary); }
  .aux-tab.is-active { color: var(--brand-pink); border-bottom-color: var(--brand-pink); font-weight: 600; }

  .aux-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
  .aux-header h1 { font-size: 20px; font-weight: 700; color: var(--text-primary); margin: 0 0 4px; }
  .aux-header p { font-size: 13.5px; color: var(--text-secondary); margin: 0; max-width: 540px; }

  .aux-filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-top: 20px; }
  .aux-filters .ef-field { width: auto; }
  .aux-filters .ef-input { width: 280px; }
  .aux-filters .ef-input.w-cpf { width: 200px; }

  .aux-table-wrap { margin-top: 16px; }

  .empresas-count-empty { font-size: 13px; color: var(--text-tertiary); }

  /* Drawer lateral — padrão do catálogo, sufixado Contador(es) */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 480px; background: var(--surface); border-left: 1px solid var(--border); z-index: 50; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .25s cubic-bezier(.25,.46,.45,.94); }
  .drawer.open { transform: translateX(0); }
  .drawer-header { padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: flex-start; gap: 12px; }
  .drawer-title { font-size: 15px; font-weight: 700; color: var(--text-primary); line-height: 1.3; }
  .drawer-desc { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
  .drawer-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0; background: var(--surface); }
  .drawer-block { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }

  .contador-empresa-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .contador-empresa-row:last-child { border-bottom: none; }
  .contador-empresa-row .nome { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .contador-empresa-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--brand-blue); text-decoration: none; white-space: nowrap; }
  .contador-empresa-link:hover { text-decoration: underline; }

  .field-error { font-size: 11.5px; color: var(--danger); margin-top: 4px; display: none; }
  .field-error.show { display: block; }

  #toast-wrap-contadores { position: fixed; bottom: 24px; right: 24px; z-index: 80; display: flex; flex-direction: column; gap: 8px; }
  .toast { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1px solid var(--border); border-left: 3px solid var(--success); border-radius: 10px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.12); min-width: 280px; max-width: 360px; animation: toastIn .2s ease; }
  .toast.toast-success { border-left-color: var(--success); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .toast-icon { width: 18px; height: 18px; color: var(--success); flex-shrink: 0; margin-top: 1px; }
  .toast-title { font-size: 13px; font-weight: 600; color: var(--text-primary); display: block; }
  .toast-desc { font-size: 12px; color: var(--text-secondary); display: block; margin-top: 1px; }
</style>
</head>
<body>

<div class="aux-page-wrap">
  <div>
    <div class="aux-tabs-label">Cadastros Auxiliares</div>
    <div class="aux-tabs-list">
      <a href="socios.html" class="aux-tab">Sócios</a>
      <a href="contadores.html" class="aux-tab is-active">Registro de Contadores</a>
    </div>
  </div>

  <div class="aux-header">
    <div>
      <h1>Registro de Contadores</h1>
      <p>Cadastro único de contadores habilitados a atender uma ou mais empresas.</p>
    </div>
    <button type="button" class="btn btn-primary" id="btn-novo-contador">
      <i data-lucide="plus" style="width:14px;height:14px"></i> Novo contador
    </button>
  </div>

  <div class="aux-filters">
    <div class="ef-field">
      <label class="ef-label" for="f-nome">Nome</label>
      <input id="f-nome" class="ef-input" placeholder="Pesquisar por nome" />
    </div>
    <div class="ef-field">
      <label class="ef-label" for="f-cpf">CPF</label>
      <input id="f-cpf" class="ef-input w-cpf" placeholder="Pesquisar por CPF" />
    </div>
  </div>

  <div class="aux-table-wrap">
    <div id="dt-contadores"></div>
  </div>
</div>

<!-- Toast de confirmação -->
<div id="toast-wrap-contadores"></div>

<script src="../empresas/js/data.js"></script>
<script src="js/contadores/data.js"></script>
<script>
window.FLOW_CONFIG = { standalone: true };
// FLOW_CONFIG.module seria 'autopilot_configs' (Autopilot Configs) se esta
// tela um dia entrar no shell do Cockpit — aqui é standalone: true porque é
// um cadastro mestre, não o fluxo fila -> tarefa do operador.

const D = window.ContadoresData;
const E = window.EmpresasData;

const stateContadores = { nome: "", cpf: "" };
let contadorAtualId = null;

function apenasDigitosContadores(v) {
  return (v || "").replace(/\D/g, "");
}

// ===== Listagem (datatable do Cockpit) =====

function contadorCorrespondeAosFiltros(contador) {
  const nome = stateContadores.nome.trim().toLowerCase();
  const cpf = apenasDigitosContadores(stateContadores.cpf);
  const nomeOk = !nome || contador.nome.toLowerCase().includes(nome);
  const cpfOk = !cpf || apenasDigitosContadores(contador.cpf).includes(cpf);
  return nomeOk && cpfOk;
}

function empresasVinculadasCellContadores(contador) {
  const qtd = (contador.empresasAtendidas || []).length;
  if (qtd === 0) return '<span class="empresas-count-empty">Nenhuma empresa</span>';
  return '<span class="badge badge-neutral">' + qtd + (qtd === 1 ? " empresa" : " empresas") + "</span>";
}

function renderTabelaContadores() {
  const contadores = D.getContadores();
  const filtrados = contadores
    .filter(contadorCorrespondeAosFiltros)
    .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" }));

  dtCreate("contadores", {
    columns: [
      { key: "nome", label: "Nome", sortable: true },
      { key: "cpf", label: "CPF", mono: true },
      { key: "crc", label: "CRC", mono: true },
      { key: "empresas", label: "Empresas vinculadas", render: (row) => empresasVinculadasCellContadores(row) },
    ],
    rows: filtrados,
    rowKey: "id",
    pageSize: 10,
    searchable: false,
    onRowClick: (row) => abrirDrawerContador(row),
    emptyMessage: "Nenhum contador encontrado para os filtros selecionados.",
  });
}

// ===== Drawer lateral (novo / editar-e-visualizar, sempre editável) =====

function garantirOverlaysContadores() {
  if (document.getElementById("contador-drawer-overlay")) return;
  const wrap = document.createElement("div");
  wrap.innerHTML =
    '<div class="drawer-overlay" id="contador-drawer-overlay" onclick="fecharDrawerContador()"></div>' +
    '<div class="drawer" id="contador-drawer" role="dialog" aria-modal="true" aria-labelledby="contador-drawer-title">' +
      '<div class="drawer-header">' +
        '<div style="flex:1;min-width:0">' +
          '<div class="drawer-title" id="contador-drawer-title">Novo contador</div>' +
          '<div class="drawer-desc">Cadastro único de contador — reutilizado por todas as empresas onde o contador for vinculado.</div>' +
        "</div>" +
        '<button class="btn btn-ghost btn-xs" onclick="fecharDrawerContador()"><i data-lucide="x" style="width:14px;height:14px"></i></button>' +
      "</div>" +
      '<div class="drawer-body" id="contador-drawer-body"></div>' +
      '<div class="drawer-footer" id="contador-drawer-footer"></div>' +
    "</div>";
  document.body.appendChild(wrap);
}

function corpoDrawerContadorHtml(contador) {
  return (
    '<div class="ef-field">' +
      '<label class="ef-label" for="contador-nome">Nome completo *</label>' +
      '<input id="contador-nome" class="ef-input" placeholder="Nome completo do contador" value="' + (contador ? esc(contador.nome) : "") + '" />' +
    "</div>" +
    '<div class="ef-field">' +
      '<label class="ef-label" for="contador-cpf">CPF *</label>' +
      '<input id="contador-cpf" class="ef-input" placeholder="000.000.000-00" maxlength="14" value="' + (contador ? esc(contador.cpf) : "") + '" />' +
      '<span class="field-error" id="contador-cpf-erro">Já existe um contador cadastrado com este CPF.</span>' +
    "</div>" +
    '<div class="ef-field">' +
      '<label class="ef-label" for="contador-crc">CRC *</label>' +
      '<input id="contador-crc" class="ef-input" placeholder="0SP000000/O-0" value="' + (contador ? esc(contador.crc) : "") + '" />' +
    "</div>" +
    (contador ? '<div id="contador-grupo-empresas"><div class="ef-label" style="margin-bottom:8px;">Empresas vinculadas</div><div class="drawer-block" id="contador-empresas-lista"></div></div>' : "")
  );
}

function empresaVinculoRowHtmlContador(codigoEmpresa) {
  const empresa = E.findEmpresaByCodigo(codigoEmpresa);
  const nomeEmpresa = empresa ? empresa.nome : codigoEmpresa;
  return (
    '<div class="contador-empresa-row">' +
      '<div style="min-width:0">' +
        '<div class="nome">' + esc(nomeEmpresa) + "</div>" +
      "</div>" +
      (empresa
        ? '<a href="../empresas/dados-gerais.html?empresa=' + encodeURIComponent(empresa.codigo) + '" class="contador-empresa-link">Abrir cadastro <i data-lucide="arrow-up-right" style="width:13px;height:13px"></i></a>'
        : "") +
    "</div>"
  );
}

function preencherEmpresasVinculadasContador(contador) {
  const lista = document.getElementById("contador-empresas-lista");
  if (!lista) return;
  const empresas = contador.empresasAtendidas || [];
  lista.innerHTML = empresas.length === 0
    ? '<span class="empresas-count-empty">Nenhuma empresa vinculada</span>'
    : empresas.map(empresaVinculoRowHtmlContador).join("");
}

function rodapeDrawerContadorHtml() {
  return (
    '<button type="button" class="btn btn-secondary" onclick="fecharDrawerContador()">Cancelar</button>' +
    '<button type="button" class="btn btn-primary" id="contador-salvar" disabled onclick="salvarContador()">Salvar</button>'
  );
}

function validarContador() {
  const campoNome = document.getElementById("contador-nome");
  const campoCpf = document.getElementById("contador-cpf");
  const campoCrc = document.getElementById("contador-crc");
  const cpfErro = document.getElementById("contador-cpf-erro");
  const btnSalvar = document.getElementById("contador-salvar");
  if (!campoNome || !campoCpf || !campoCrc || !btnSalvar) return;

  const nomeOk = campoNome.value.trim().length > 0;
  const digitosCpf = campoCpf.value.replace(/\D/g, "");
  const cpfCompleto = digitosCpf.length === 11;
  const cpfDuplicado = cpfCompleto && D.cpfJaCadastrado(campoCpf.value, contadorAtualId);
  const crcOk = campoCrc.value.trim().length > 0;
  cpfErro.classList.toggle("show", !!cpfDuplicado);
  btnSalvar.disabled = !(nomeOk && cpfCompleto && !cpfDuplicado && crcOk);
}

function wireCamposDrawerContador() {
  const campoNome = document.getElementById("contador-nome");
  const campoCpf = document.getElementById("contador-cpf");
  const campoCrc = document.getElementById("contador-crc");
  campoNome.addEventListener("input", validarContador);
  campoCrc.addEventListener("input", validarContador);
  campoCpf.addEventListener("input", (e) => {
    e.target.value = D.formatarCpfInput(e.target.value);
    validarContador();
  });
}

function abrirDrawerContador(contador) {
  garantirOverlaysContadores();
  contadorAtualId = contador ? contador.id : null;
  document.getElementById("contador-drawer-title").textContent = contador ? contador.nome : "Novo contador";
  document.getElementById("contador-drawer-body").innerHTML = corpoDrawerContadorHtml(contador);
  document.getElementById("contador-drawer-footer").innerHTML = rodapeDrawerContadorHtml();
  if (contador) preencherEmpresasVinculadasContador(contador);
  wireCamposDrawerContador();
  validarContador();
  document.getElementById("contador-drawer-overlay").classList.add("open");
  document.getElementById("contador-drawer").classList.add("open");
  refreshIcons();
}

function fecharDrawerContador() {
  const overlay = document.getElementById("contador-drawer-overlay");
  const drawer = document.getElementById("contador-drawer");
  if (overlay) overlay.classList.remove("open");
  if (drawer) drawer.classList.remove("open");
}

function salvarContador() {
  const campoNome = document.getElementById("contador-nome");
  const campoCpf = document.getElementById("contador-cpf");
  const campoCrc = document.getElementById("contador-crc");

  const contadores = D.getContadores();
  if (contadorAtualId) {
    const atualizados = contadores.map((c) =>
      c.id !== contadorAtualId
        ? c
        : Object.assign({}, c, {
            nome: campoNome.value.trim(),
            cpf: campoCpf.value,
            crc: campoCrc.value.trim(),
          })
    );
    D.setContadores(atualizados);
    fecharDrawerContador();
    renderTabelaContadores();
    showToastContadores("Contador atualizado", campoNome.value.trim() + " foi atualizado com sucesso.");
  } else {
    const novoId = contadores.reduce((max, c) => Math.max(max, c.id), 0) + 1;
    contadores.push({
      id: novoId,
      nome: campoNome.value.trim(),
      cpf: campoCpf.value,
      crc: campoCrc.value.trim(),
      empresasAtendidas: [],
    });
    D.setContadores(contadores);
    fecharDrawerContador();
    renderTabelaContadores();
    showToastContadores("Contador cadastrado", campoNome.value.trim() + " foi adicionado ao Registro de Contadores.");
  }
}

// ===== Toast =====

function showToastContadores(title, desc) {
  const wrap = document.getElementById("toast-wrap-contadores");
  const el = document.createElement("div");
  el.className = "toast toast-success";
  el.innerHTML =
    '<i data-lucide="check-circle-2" class="toast-icon"></i>' +
    '<div>' +
      '<span class="toast-title">' + esc(title) + "</span>" +
      '<span class="toast-desc">' + esc(desc) + "</span>" +
    "</div>";
  wrap.appendChild(el);
  refreshIcons();
  setTimeout(() => el.remove(), 5000);
}

// ===== Setup =====

document.addEventListener("keydown", (e) => {
  const drawer = document.getElementById("contador-drawer");
  if (e.key === "Escape" && drawer && drawer.classList.contains("open")) fecharDrawerContador();
});

document.getElementById("btn-novo-contador").addEventListener("click", () => abrirDrawerContador(null));

document.getElementById("f-nome").addEventListener("input", (e) => {
  stateContadores.nome = e.target.value;
  renderTabelaContadores();
});
document.getElementById("f-cpf").addEventListener("input", (e) => {
  e.target.value = D.formatarCpfInput(e.target.value);
  stateContadores.cpf = e.target.value;
  renderTabelaContadores();
});
</script>
<script src="../assets/core/cockpit-01-shell.js"></script>
<script src="../assets/core/cockpit-02-state-helpers.js"></script>
<script src="../assets/core/cockpit-08-datatable.js"></script>
<script src="../assets/core/cockpit-07-modals-init.js"></script>
<script src="../assets/core/cockpit-09-cx-sidebar.js"></script>
<script>
  // A tabela é montada pelo FLOW_CONFIG inline acima, mas dtCreate/esc/
  // refreshIcons só existem depois dos arquivos de core/ carregarem — refaz
  // a primeira renderização aqui.
  renderTabelaContadores();
</script>
</body>
</html>
