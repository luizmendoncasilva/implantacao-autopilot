<!doctype html>
<html lang="pt-BR" data-theme="cockpit">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23171717%27/%3E%3Ctext x=%2712%27 y=%2716.5%27 font-family=%27Arial%2C sans-serif%27 font-size=%278%27 font-weight=%27700%27 fill=%27%23fafafa%27 text-anchor=%27middle%27%3EAP%3C/text%3E%3C/svg%3E" />
  <title>Implantação — AutoPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../core/cockpit-01-shell.js"></script>
  <script src="../core/cockpit-09-cx-sidebar.js"></script>
  <link rel="expect" href="#page-ready" blocking="render" />
  <link rel="stylesheet" href="../shared/css/tokens.css" />
  <link rel="stylesheet" href="../shared/css/base.css" />
  <link rel="stylesheet" href="../shared/css/components.css" />
  <link rel="stylesheet" href="../shared/css/layout.css" />
  <link rel="stylesheet" href="css/implantacao.css" />
</head>
<body>
  <div id="shell-root"></div>

  <!-- Console geral da Implantação: a única entrada da sidebar. Cada empresa
       aparece uma vez, com as frentes DP, Fiscal e Contábil lado a lado; a
       empresa abre em implantacao-console.html, onde cada frente é uma aba. -->
  <template id="page-content">
    <section class="flex flex-col gap-5">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div class="flex flex-col gap-1">
          <h1 class="text-xl font-semibold">Implantação</h1>
          <p class="text-sm text-muted max-w-2xl">Todas as empresas do Cockpit, com o status de implantação em cada frente. Abra a empresa e use a Nova implantação dentro da aba DP ou Fiscal.</p>
        </div>
      </div>

      <div class="flex flex-wrap gap-3" id="dash-implantacao-geral-mount"></div>

      <div class="flex flex-wrap items-end gap-3">
        <div class="flex flex-col gap-1-5">
          <label class="field-label" for="f-busca-empresa-geral">Empresa</label>
          <input id="f-busca-empresa-geral" class="field-input w-72" placeholder="Pesquisar por nome ou CNPJ" />
        </div>
        <div class="flex flex-col gap-1-5">
          <label class="field-label">Status</label>
          <div class="combobox w-52" id="combo-status-geral" data-all-label="Todos os status">
            <button type="button" class="combobox-trigger has-value">
              <span class="combobox-label truncate">Em andamento</span>
              <span class="chev"></span>
            </button>
            <div class="combobox-panel">
              <div class="combobox-list"></div>
            </div>
          </div>
        </div>
        <div class="flex flex-col gap-1-5">
          <span class="field-label">Com pendência em</span>
          <div class="toggle-group" role="radiogroup" aria-label="Frente com pendência" id="toggle-frente-pendencia">
            <button type="button" class="toggle-item is-on" data-frente-filtro="todas" role="radio" aria-checked="true">Todas</button>
            <button type="button" class="toggle-item" data-frente-filtro="dp" role="radio" aria-checked="false">DP</button>
            <button type="button" class="toggle-item" data-frente-filtro="fiscal" role="radio" aria-checked="false">Fiscal</button>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table class="dtable dtable-fixed" id="tabela-implantacao-geral">
          <colgroup>
            <col />
            <col style="width:112px" />
            <col style="width:112px" />
            <col style="width:145px" />
            <col style="width:150px" />
            <col style="width:134px" />
            <col style="width:90px" />
            <col style="width:140px" />
            <col style="width:32px" />
          </colgroup>
          <thead>
            <tr>
              <th>Empresa</th>
              <th class="col-pad-sm th-wrap">DP no Cockpit</th>
              <th class="col-pad-sm th-wrap">Fiscal no Cockpit</th>
              <th class="col-pad-sm th-wrap">Status no Cockpit</th>
              <th class="col-pad-sm">DP</th>
              <th class="col-pad-sm">Fiscal</th>
              <th class="col-pad-sm">Contábil</th>
              <th class="col-pad-sm">Implantação</th>
              <th class="col-pad-end"><span class="sr-only">Abrir</span></th>
            </tr>
          </thead>
          <tbody id="tabela-implantacao-geral-body"></tbody>
        </table>
      </div>
      <div id="paginacao-geral-mount"></div>
    </section>
  </template>

  <script src="../shared/js/icons.js"></script>
  <script src="../shared/js/chassi-dados.js"></script>
  <script src="../shared/js/chassi.js"></script>
  <script src="../shared/js/shell.js"></script>
  <script src="../shared/js/ui.js"></script>
  <script src="../shared/js/fab-tools.js"></script>
  <script src="js/implantacao-ui.js"></script>
  <script src="../empresas/js/data.js"></script>
  <script src="js/implantacao/data.js?v=5"></script>
  <script src="js/implantacao/empresas-data.js?v=9"></script>
  <script src="js/implantacao/fiscal-data.js?v=1"></script>
  <script src="js/implantacao/frentes.js?v=1"></script>
  <script>
    Shell.mount(document.getElementById("shell-root"), {
      base: "../",
      active: "implantacao",
      crumb: "implantação",
    });
  </script>
  <script src="js/implantacao/geral-list.js?v=6"></script>
  <span id="page-ready" hidden></span>
</body>
</html>
