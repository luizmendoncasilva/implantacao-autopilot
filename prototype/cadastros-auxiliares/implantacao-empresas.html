<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23171717%27/%3E%3Ctext x=%2712%27 y=%2716.5%27 font-family=%27Arial%2C sans-serif%27 font-size=%278%27 font-weight=%27700%27 fill=%27%23fafafa%27 text-anchor=%27middle%27%3EAP%3C/text%3E%3C/svg%3E" />
  <title>Implantação DP — AutoPilot</title>
  <link rel="stylesheet" href="../shared/css/tokens.css" />
  <link rel="stylesheet" href="../shared/css/base.css" />
  <link rel="stylesheet" href="../shared/css/components.css?v=2" />
  <link rel="stylesheet" href="../shared/css/layout.css?v=2" />
</head>
<body>
  <div id="shell-root"></div>

  <template id="page-content">
    <section class="max-w-7xl flex flex-col gap-4">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <h1 class="text-xl font-semibold mb-1">Implantação DP</h1>
          <p class="text-sm text-muted max-w-2xl" id="implantacao-empresas-subtitulo">Acompanhamento por empresa: colaboradores, histórico de folha e cálculo em paralelo — mais rubricas e histórico, de forma informativa.</p>
        </div>
        <a href="implantacao-importar.html" class="btn btn-sm w-fit" id="btn-importar-ficha-empresas"><span id="icon-upload-empresas"></span> Nova Implantação</a>
      </div>

      <div class="flex flex-wrap items-end gap-3">
        <div class="flex flex-col gap-1">
          <label class="field-label">Empresa</label>
          <input id="f-busca-empresa" class="field-input w-72" placeholder="Pesquisar por nome ou CNPJ" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="field-label">Status</label>
          <div class="combobox w-72" id="combo-status-empresa" data-all-label="Todos os status">
            <button type="button" class="combobox-trigger has-value">
              <span class="combobox-label truncate">Em andamento</span>
              <span class="chev"></span>
            </button>
            <div class="combobox-panel">
              <div class="combobox-list"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table class="dtable dtable-fixed" id="tabela-empresas-implantacao">
          <colgroup>
            <col />
            <col style="width:260px" />
            <col style="width:150px" />
            <col style="width:40px" />
          </colgroup>
          <thead>
            <tr>
              <th>Empresa</th>
              <th class="col-pad-md">Etapa atual</th>
              <th class="col-pad-md">Status</th>
              <th class="col-pad-end"></th>
            </tr>
          </thead>
          <tbody id="tabela-empresas-implantacao-body"></tbody>
        </table>
      </div>
    </section>
  </template>

  <script src="../shared/js/icons.js"></script>
  <script src="../shared/js/shell.js?v=3"></script>
  <script src="../shared/js/ui.js?v=3"></script>
  <script src="../shared/js/fab-tools.js"></script>
  <script src="../empresas/js/data.js"></script>
  <script src="js/implantacao/data.js?v=5"></script>
  <script src="js/implantacao/empresas-data.js?v=8"></script>
  <script>
    Shell.mount(document.getElementById("shell-root"), {
      base: "../",
      active: "implantacao-dp",
      crumbs: [{ label: "implantação de empresas", href: "implantacao-geral.html" }, { label: "DP" }],
    });
    document.querySelectorAll(".field-select-wrap .chev, .combobox .chev").forEach((el) => (el.innerHTML = Icon("chevron-down", "size-4")));
    document.getElementById("icon-upload-empresas").innerHTML = Icon("upload", "size-4");
  </script>
  <script src="js/implantacao/empresas-list.js?v=6"></script>
</body>
</html>
