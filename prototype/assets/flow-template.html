<script>
window.FLOW_CONFIG = {
  // Módulo deste protótipo: 'dp' | 'fiscal' | 'contabil' | 'bpo' | 'autopilot_configs'
  // Pergunte ao usuário qual é, sempre — não assuma 'dp' por padrão.
  module: '{{MODULO}}',

  // Tela por onde o protótipo deve abrir. 'queue' é a fila (comportamento
  // antigo/legado) — só use se o pedido for de fato sobre a fila de tarefas.
  // Na dúvida, prefira 'task' ou 'execution' e aponte pra tela específica
  // pedida, ou use standalone:true (ver flow-config-contract.md) se for uma
  // tela adaptada de um layout/print que não segue o shell do Cockpit.
  entryScreen: '{{ENTRY_SCREEN}}', // 'queue' | 'task' | 'execution' | 'success'

  operacaoLabel: '{{OPERACAO_LABEL}}',
  typeCode: '{{TYPE_CODE}}',
  TYPE_METADATA: {
    '{{TYPE_CODE}}': {
      icon: 'file-text',
      label: '{{TIPO_LABEL}}',
      desc: '{{TIPO_DESC}}',
      color: '#f25461',
    },
  },
  EXEC_STEPS: 'geral',
  FORM_TABS_BY_TYPE: {
    '{{TYPE_CODE}}': [{ id: 'resumo', label: 'Resumo' }],
  },
  getInitialState() {
    return {
      queue: [
        // Adicionar 2-3 tarefas mock realistas aqui.
        // Ver flow-config-contract.md para o formato completo de cada item.
      ],
    };
  },
};
