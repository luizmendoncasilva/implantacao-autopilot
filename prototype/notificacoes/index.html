<!doctype html>
<html lang="pt-BR" data-theme="cockpit">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23171717%27/%3E%3Ctext x=%2712%27 y=%2716.5%27 font-family=%27Arial%2C sans-serif%27 font-size=%278%27 font-weight=%27700%27 fill=%27%23fafafa%27 text-anchor=%27middle%27%3EAP%3C/text%3E%3C/svg%3E" />
  <title>Atividades — AutoPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../core/cockpit-01-shell.js"></script>
  <script src="../core/cockpit-09-cx-sidebar.js"></script>
  <link rel="expect" href="#page-ready" blocking="render" />
  <link rel="stylesheet" href="../shared/css/tokens.css" />
  <link rel="stylesheet" href="../shared/css/base.css" />
  <link rel="stylesheet" href="../shared/css/components.css" />
  <link rel="stylesheet" href="../shared/css/layout.css" />
</head>
<body>
  <div id="shell-root"></div>

  <!-- "Ver todas" do sino: a mesma lista do painel, em formato de página, 20 por vez. -->
  <template id="page-content">
    <section class="flex flex-col gap-4" style="max-width:760px;">
      <a href="javascript:history.back()" class="flex items-center gap-1 text-sm font-medium link-info w-fit"><span id="icon-voltar"></span> Voltar</a>
      <div class="flex flex-col gap-1">
        <h1 class="text-xl font-semibold">Atividades</h1>
        <p class="text-sm text-muted">Tudo o que aconteceu nos seus clientes. Clique numa atividade para ir até o que a gerou.</p>
      </div>
      <div class="flex flex-col gap-3" id="atividades-mount"></div>
    </section>
  </template>

  <script src="../shared/js/icons.js"></script>
  <script src="../shared/js/chassi-dados.js"></script>
  <script src="../shared/js/chassi.js"></script>
  <script src="../shared/js/shell.js"></script>
  <script src="../shared/js/ui.js"></script>
  <script src="../shared/js/fab-tools.js"></script>
  <script>
    Shell.mount(document.getElementById("shell-root"), { base: "../", active: "", crumb: "atividades" });
    document.getElementById("icon-voltar").innerHTML = Icon("chevron-left", "size-3-5");
    Chassi.renderVerTodas(document.getElementById("atividades-mount"));
  </script>
  <span id="page-ready" hidden></span>
</body>
</html>
