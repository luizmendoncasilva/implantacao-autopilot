<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23171717%27/%3E%3Ctext x=%2712%27 y=%2716.5%27 font-family=%27Arial%2C sans-serif%27 font-size=%278%27 font-weight=%27700%27 fill=%27%23fafafa%27 text-anchor=%27middle%27%3EAP%3C/text%3E%3C/svg%3E" />
  <title>Rubricas — DP — AutoPilot</title>
  <link rel="stylesheet" href="../shared/css/tokens.css" />
  <link rel="stylesheet" href="../shared/css/base.css" />
  <link rel="stylesheet" href="../shared/css/components.css" />
  <link rel="stylesheet" href="../shared/css/layout.css" />
</head>
<body>
  <div id="shell-root"></div>

  <template id="page-content">
    <section class="max-w-7xl flex flex-col gap-4">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <h1 class="text-xl font-semibold mb-1">Rubricas</h1>
          <p class="text-sm text-muted max-w-xl">
            Cadastro das rubricas de folha de pagamento — proventos, descontos e informativas — que determinam como cada verba é calculada, tributada e apresentada no recibo.
          </p>
        </div>
        <button type="button" class="btn btn-sm w-fit" id="btn-nova-rubrica">::icon-plus:: Nova rubrica</button>
      </div>

      <div class="flex flex-wrap items-end gap-3">
        <div class="flex flex-col gap-1">
          <label class="field-label">Pesquisar</label>
          <input id="f-busca" class="field-input w-72" placeholder="Pesquisar por código ou nome" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="field-label">Situação</label>
          <div class="field-select-wrap">
            <select id="f-situacao" class="field-select">
              <option value="">Todas</option>
              <option value="Ativo">Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
            <span class="chev">::chevron-down::</span>
          </div>
        </div>
        <div class="flex flex-col gap-1">
          <label class="field-label">Tipo</label>
          <div class="field-select-wrap">
            <select id="f-tipo" class="field-select">
              <option value="">Todos</option>
              <option value="provento">Provento</option>
              <option value="desconto">Desconto</option>
              <option value="informativo">Informativo</option>
            </select>
            <span class="chev">::chevron-down::</span>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table class="dtable dtable-fixed" id="tabela-rubricas">
          <colgroup>
            <col style="width:110px" />
            <col />
            <col style="width:150px" />
            <col style="width:130px" />
            <col style="width:40px" />
          </colgroup>
          <thead>
            <tr>
              <th class="col-pad-sm">Código</th>
              <th>Nome</th>
              <th class="col-pad-md">Tipo</th>
              <th class="col-pad-md">Situação</th>
              <th class="col-pad-end"></th>
            </tr>
          </thead>
          <tbody id="tabela-rubricas-body"></tbody>
        </table>
      </div>

      <button type="button" class="btn btn-ghost btn-sm w-fit" id="btn-mostrar-mais" style="display:none;">Mostrar mais</button>
    </section>
  </template>

  <script src="../shared/js/icons.js"></script>
  <script src="../shared/js/shell.js"></script>
  <script src="../shared/js/ui.js"></script>
  <script src="../shared/js/fab-tools.js"></script>
  <script src="js/data.js"></script>
  <script>
    Shell.mount(document.getElementById("shell-root"), { base: "../", active: "rubricas", crumb: "rubricas" });
    document.getElementById("btn-nova-rubrica").innerHTML = Icon("plus", "size-3-5") + " Nova rubrica";
    // troca placeholder do select nativo pelo ícone real (o texto "::chevron-down::" foi só reserva de espaço no template) — mesmo padrão de empresas/index.html.
    document.querySelectorAll(".chev").forEach((el) => (el.innerHTML = Icon("chevron-down", "size-4")));
  </script>
  <script src="js/list.js"></script>
</body>
</html>
