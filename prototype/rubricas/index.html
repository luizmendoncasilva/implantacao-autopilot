<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>Rubricas · Autopilot Configs</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--surface-muted); }
  .rb-wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 20px; width: 100%; }
  .rb-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .rb-title { font-size: 20px; font-weight: 700; color: var(--text-primary); margin: 0 0 4px; }
  .rb-desc { font-size: 13px; color: var(--text-secondary); max-width: 560px; margin: 0; line-height: 1.5; }
  .rb-filters { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .rb-field { display: flex; flex-direction: column; gap: 4px; }
  .rb-field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .rb-field input, .rb-field select {
    height: 36px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font-size: 13px;
    font-family: 'Inter', sans-serif; background: var(--surface); color: var(--text-primary); min-width: 180px;
  }
  .rb-field input:focus, .rb-field select:focus { outline: none; border-color: var(--brand-pink); }
  .rb-mono { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
</style>
</head>
<body>

<div class="rb-wrap">
  <div class="rb-head">
    <div>
      <h1 class="rb-title">Rubricas</h1>
      <p class="rb-desc">Cadastro das rubricas de folha de pagamento — proventos, descontos e informativas — que determinam como cada verba é calculada, tributada e apresentada no recibo.</p>
    </div>
    <button type="button" class="btn btn-primary" id="btn-nova-rubrica"><i data-lucide="plus" style="width:14px;height:14px"></i> Nova rubrica</button>
  </div>

  <div class="section-card" style="padding:16px 18px;">
    <div class="rb-filters">
      <div class="rb-field">
        <label>Pesquisar</label>
        <input id="f-busca" placeholder="Pesquisar por código ou nome" />
      </div>
      <div class="rb-field">
        <label>Situação</label>
        <select id="f-situacao">
          <option value="">Todas</option>
          <option value="Ativo">Ativo</option>
          <option value="Inativo">Inativo</option>
        </select>
      </div>
      <div class="rb-field">
        <label>Tipo</label>
        <select id="f-tipo">
          <option value="">Todos</option>
          <option value="provento">Provento</option>
          <option value="desconto">Desconto</option>
          <option value="informativo">Informativo</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section-card" style="padding:0;">
    <div id="dt-rubricas"></div>
  </div>
</div>

<script>
window.FLOW_CONFIG = { standalone: true };

// Mock — mesmo catálogo de rubricas do protótipo original (rubricas/js/data.js),
// simplificado para os campos usados nesta listagem.
const RUBRICAS_MOCK = [
  { codigo: "1000", nome: "Salário Base", tipo: "provento", situacao: "Ativo" },
  { codigo: "1010", nome: "Hora Extra 50%", tipo: "provento", situacao: "Ativo" },
  { codigo: "1020", nome: "Adicional Noturno", tipo: "provento", situacao: "Ativo" },
  { codigo: "9010", nome: "Desconto Vale Transporte", tipo: "desconto", situacao: "Ativo" },
  { codigo: "9020", nome: "Desconto Convênio Farmácia", tipo: "desconto", situacao: "Inativo" },
  { codigo: "5000", nome: "Base de Cálculo INSS (Informativo)", tipo: "informativo", situacao: "Ativo" },
];
const TIPO_LABEL = { provento: "Provento", desconto: "Desconto", informativo: "Informativo" };

function abrirRubrica(codigo) {
  window.location.href = "rubrica.html?rubrica=" + encodeURIComponent(codigo);
}

function aplicarFiltrosRubricas() {
  const busca = document.getElementById("f-busca").value.trim().toLowerCase();
  const situacao = document.getElementById("f-situacao").value;
  const tipo = document.getElementById("f-tipo").value;
  const filtradas = RUBRICAS_MOCK.filter((r) => {
    if (busca && !(r.codigo.toLowerCase().includes(busca) || r.nome.toLowerCase().includes(busca))) return false;
    if (situacao && r.situacao !== situacao) return false;
    if (tipo && r.tipo !== tipo) return false;
    return true;
  });
  dtSetRows('rubricas', filtradas);
}

document.getElementById("btn-nova-rubrica").addEventListener("click", () => (window.location.href = "rubrica.html"));
document.getElementById("f-busca").addEventListener("input", aplicarFiltrosRubricas);
document.getElementById("f-situacao").addEventListener("change", aplicarFiltrosRubricas);
document.getElementById("f-tipo").addEventListener("change", aplicarFiltrosRubricas);
</script>
<script src="../assets/core/cockpit-01-shell.js"></script>
<script src="../assets/core/cockpit-02-state-helpers.js"></script>
<script src="../assets/core/cockpit-08-datatable.js"></script>
<script src="../assets/core/cockpit-07-modals-init.js"></script>
<script src="../assets/core/cockpit-09-cx-sidebar.js"></script>
<script>
dtCreate('rubricas', {
  columns: [
    { key: 'codigo', label: 'Código', sortable: true, render: (row) => '<span class="rb-mono">' + row.codigo + '</span>' },
    { key: 'nome', label: 'Nome', sortable: true },
    { key: 'tipo', label: 'Tipo', render: (row) => TIPO_LABEL[row.tipo] || row.tipo },
    { key: 'situacao', label: 'Situação', render: (row) => '<span class="badge ' + (row.situacao === 'Ativo' ? 'badge-success' : 'badge-neutral') + '">' + row.situacao + '</span>' },
  ],
  rows: RUBRICAS_MOCK,
  rowKey: 'codigo',
  pageSize: 25,
  searchable: false,
  onRowClick: (row) => abrirRubrica(row.codigo),
  emptyMessage: 'Nenhuma rubrica encontrada para os filtros informados.',
});
refreshIcons();
</script>
</body>
</html>
