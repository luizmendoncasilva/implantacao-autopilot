function deepMergeFolha(base, overrides) {
  if (!overrides) return base;
  Object.keys(overrides).forEach((k) => {
    const ov = overrides[k];
    if (ov && typeof ov === 'object' && !Array.isArray(ov)) base[k] = deepMergeFolha(base[k] && typeof base[k] === 'object' ? base[k] : {}, ov);
    else base[k] = ov;
  });
  return base;
}

/* ---- Humanização de chaves camelCase (labels não documentados literalmente) ---- */
function humanizeFolha(key) {
  let tokens = key.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2').split(' ');
  let out = tokens.map((t, i) => {
    if (t === t.toUpperCase() && t.length > 1 && !/^\d+$/.test(t)) return t;
    const lower = t.toLowerCase();
    return i === 0 ? lower.charAt(0).toUpperCase() + lower.slice(1) : lower;
  });
  let s = out.join(' ');
  const fixes = [['nao', 'não'], ['medias', 'médias'], ['medio', 'médio'], ['periodo', 'período'], ['indenizacao', 'indenização'], ['decimo', 'décimo'], ['beneficio', 'benefício'], ['publico', 'público'], ['unico', 'único'], ['obrigatorio', 'obrigatório'], ['automatico', 'automático'], ['funrural', 'FUNRURAL'], ['sabado', 'sábado'], ['ultimo', 'último'], ['maximo', 'máximo'], ['minimo', 'mínimo'], ['servico', 'serviço'], ['licenca', 'licença'], ['comissao', 'comissão'], ['comissoes', 'comissões'], ['proporcao', 'proporção'], ['excedentes', 'excedentes'], ['municipal', 'municipal']];
  fixes.forEach(([a, b]) => { s = s.replace(new RegExp('\\b' + a + '\\b', 'gi'), b); });
  return s;
}

/* ---- Helpers de UI: campo view/edit ---- */
function fvFolha(label, value, wide) { return `<div class="${wide ? 'fl-field-full' : ''}"><div class="field-label">${label}</div><div class="field-value${value ? '' : ' empty'}">${value || 'Não informado'}</div></div>`; }
function feTextFolha(id, label, value, wide) { return `<div class="ef-field ${wide ? 'fl-field-full' : ''}"><label class="ef-label">${label}</label><input class="ef-input" id="${id}" value="${value || ''}" /></div>`; }
function feSelectFolha(id, label, value, options, wide) { return `<div class="ef-field ${wide ? 'fl-field-full' : ''}"><label class="ef-label">${label}</label><select class="ef-select" id="${id}"><option value="">—</option>${options.map((o) => `<option ${o === value ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`; }
function feCheckboxFolha(id, label, checked) { return `<label class="fl-cb"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} />${label}</label>`; }
function fvCheckboxFolha(label, checked) { return `<div class="fl-cb view ${checked ? 'on' : 'off'}"><i data-lucide="${checked ? 'check-circle-2' : 'circle'}"></i>${label}</div>`; }

/* Grupo genérico de checklist (booleans + subcampos {ativo,...}) — usado nos
   blocos "Personaliza" de Geral e nas listas longas de 13º/Férias/Contabilidade. */
function checklistGroupFolha(obj, mode, prefix) {
  const items = Object.keys(obj).map((k) => {
    const v = obj[k];
    const id = prefix + '__' + k;
    if (typeof v === 'boolean') {
      return mode === 'edit' ? feCheckboxFolha(id, humanizeFolha(k), v) : fvCheckboxFolha(humanizeFolha(k), v);
    }
    if (v && typeof v === 'object' && 'ativo' in v) {
      const subFields = Object.keys(v).filter((sk) => sk !== 'ativo');
      const sub = subFields.map((sk) => {
        const subId = id + '__' + sk;
        if (mode === 'edit') return `<input class="ef-input" style="max-width:140px;" id="${subId}" placeholder="${humanizeFolha(sk)}" value="${v[sk] || ''}" />`;
        return v[sk] ? `<span class="badge badge-neutral">${humanizeFolha(sk)}: ${v[sk]}</span>` : '';
      }).join('');
      const cbHtml = mode === 'edit' ? feCheckboxFolha(id + '__ativo', humanizeFolha(k), v.ativo) : fvCheckboxFolha(humanizeFolha(k), v.ativo);
      return `<div>${cbHtml}${(v.ativo || mode === 'edit') ? `<div class="fl-sub-indent">${sub}</div>` : ''}</div>`;
    }
    return '';
  });
  return `<div class="fl-checklist">${items.join('')}</div>`;
}

function readChecklistGroupFolha(obj, prefix) {
  Object.keys(obj).forEach((k) => {
    const v = obj[k];
    const id = prefix + '__' + k;
    if (typeof v === 'boolean') { const el = document.getElementById(id); if (el) obj[k] = el.checked; }
    else if (v && typeof v === 'object' && 'ativo' in v) {
      const el = document.getElementById(id + '__ativo'); if (el) v.ativo = el.checked;
      Object.keys(v).filter((sk) => sk !== 'ativo').forEach((sk) => { const se = document.getElementById(id + '__' + sk); if (se) v[sk] = se.value; });
    }
  });
}

function accTriggerFolha(groupKey, sectionKey, label, isOpen) {
  return `<button class="fl-acc-trigger${isOpen ? ' open' : ''}" onclick="toggleAccordionFolha('${groupKey}','${sectionKey}')"><span>${label}</span><i data-lucide="chevron-down" class="fl-acc-chev w-4 h-4"></i></button>`;
}
function toggleAccordionFolha(groupKey, sectionKey) { acordeonFolha[groupKey] = acordeonFolha[groupKey] === sectionKey ? null : sectionKey; renderTabContentFolha(); }

const READ_ABA_FOLHA = { geral: readGeralFolha, regime: readRegimeFolha, arredondamento: readArredondamentoFolha, adiantamento: readAdiantamentoFolha, 'decimo-terceiro': readDecimoFolha, ferias: readFeriasFolha, contabilidade: readContabilidadeFolha, honorarios: readHonorariosFolha, cronograma: readCronogramaFolha };
const CHAVE_AREA_LABEL_FOLHA = { geral: 'Geral', regime: 'Regime', arredondamento: 'Arredondamento', adiantamento: 'Adiantamento', 'decimo-terceiro': '13º Salário', ferias: 'Férias', contabilidade: 'Contabilidade', honorarios: 'Honorários', cronograma: 'Cronograma' };

function selecionarAbaFolha(key) {
  abaAtivaFolha = key;
  renderTabsFolha();
  renderTabContentFolha();
}
function renderTabsFolha() {
  const wrap = document.getElementById('fl-tabs');
  if (!wrap) return;
  wrap.innerHTML = AREAS_FOLHA.map((a) => `<div class="fl-tab${a.key === abaAtivaFolha ? ' active' : ''}" onclick="selecionarAbaFolha('${a.key}')">${a.label}</div>`).join('');
}
function renderTabContentFolha() {
  const wrap = document.getElementById('fl-tab-content');
  if (!wrap) return;
  const mode = modosEdicaoFolha[abaAtivaFolha] ? 'edit' : 'view';
  wrap.innerHTML = RENDER_ABA_FOLHA[abaAtivaFolha](mode) + (mode === 'edit' ? `<div class="fl-action-row" style="justify-content:flex-start; margin-top:4px;"><button class="btn btn-secondary" onclick="cancelarEdicaoFolha()">Cancelar</button><button class="btn btn-primary" onclick="salvarAreaFolha()">Salvar parâmetros</button></div>` : '');

  if (abaAtivaFolha === 'regime') document.getElementById('fl-regime-vig').innerHTML = renderVigenciaIndicatorRegimeFolha();

  const actionWrap = document.getElementById('fl-action-row');
  if (actionWrap) {
    const podeEditar = AREAS_COM_EDICAO_FOLHA.includes(abaAtivaFolha) && !modosEdicaoFolha[abaAtivaFolha];
    actionWrap.innerHTML = podeEditar ? `<button class="btn btn-secondary" onclick="abrirDrawerFolha('trocar-empresa')"><i data-lucide="building-2" class="w-4 h-4"></i>Trocar empresa</button><button class="btn btn-primary" onclick="entrarEdicaoFolha()"><i data-lucide="pencil" class="w-4 h-4"></i>Editar</button>` : `<button class="btn btn-secondary" onclick="abrirDrawerFolha('trocar-empresa')"><i data-lucide="building-2" class="w-4 h-4"></i>Trocar empresa</button>`;
  }
  refreshIcons();
}

function entrarEdicaoFolha() { modosEdicaoFolha[abaAtivaFolha] = true; renderTabContentFolha(); }
function cancelarEdicaoFolha() { modosEdicaoFolha[abaAtivaFolha] = false; renderTabContentFolha(); }
function salvarAreaFolha() {
  if (READ_ABA_FOLHA[abaAtivaFolha]) READ_ABA_FOLHA[abaAtivaFolha]();
  modosEdicaoFolha[abaAtivaFolha] = false;
  historicoRuntimeFolha.eventos.unshift({ data: '21/09/2026', hora: '09:00', usuario: 'Você', area: CHAVE_AREA_LABEL_FOLHA[abaAtivaFolha], acao: 'Atualização de parâmetros', descricao: 'Parâmetros desta área foram atualizados nesta sessão.' });
  renderTabContentFolha();
  showToastFolha('Parâmetros salvos', 'As alterações foram aplicadas com sucesso.');
}

function renderVigenciaIndicatorRegimeFolha() {
  const vigs = dadosFolha.regime.vigencias;
  const atual = vigs.find((v) => !v.dataFim) || vigs[0];
  const sel = vigenciaSelecionadaFolha ? vigs.find((v) => v.id === vigenciaSelecionadaFolha) : atual;
  const isAtual = !vigenciaSelecionadaFolha || vigenciaSelecionadaFolha === atual.id;
  const periodo = sel.dataFim ? `${sel.dataInicio} – ${sel.dataFim}` : `desde ${sel.dataInicio}`;
  return `<div class="fl-vig">
    <i data-lucide="calendar-clock" style="width:16px;height:16px;color:var(--text-secondary);"></i>
    <div class="fl-vig-text"><span class="lbl">${isAtual ? 'Vigência atual' : 'Vigência histórica'}</span><span class="per">${periodo}</span></div>

}

  refreshIcons();
}

function previewEmpresaFolha(codigo) {
  const preview = document.getElementById('fl-select-preview');
  const confirmBtn = document.getElementById('fl-select-confirm');
  if (!codigo) { preview.classList.remove('show'); confirmBtn.disabled = true; return; }
  const e = EMPRESAS_FOLHA[codigo];
  preview.innerHTML = `<div style="font-size:13.5px; font-weight:600; color:var(--text-primary);">${e.razaoSocial}</div><div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">CNPJ ${e.cnpj} · ${e.regime}</div>`;
  preview.classList.add('show');
  confirmBtn.disabled = false;
  confirmBtn.dataset.codigo = codigo;
}
function confirmarSelecaoEmpresaFolha() {
  const codigo = document.getElementById('fl-select-confirm').dataset.codigo;
  empresaAtualFolha = codigo;
  abaAtivaFolha = 'geral';
  inicializarDadosEmpresaFolha(codigo);
  renderShellFolha();
}

/* ---- Drawer lateral ---- */
function garantirOverlaysFolha() {
  if (document.getElementById('folha-drawer-overlay')) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="drawer-overlay" id="folha-drawer-overlay" onclick="fecharDrawerFolha()"></div>
    <div class="drawer" id="folha-drawer">
      <div class="drawer-header"><div style="flex:1;min-width:0" id="folha-drawer-header-content"></div><button class="btn btn-ghost btn-xs" onclick="fecharDrawerFolha()"><i data-lucide="x" style="width:14px;height:14px"></i></button></div>
      <div class="drawer-body" id="folha-drawer-body"></div>
      <div class="drawer-footer" id="folha-drawer-footer"></div>
    </div>`;
  document.body.appendChild(wrap);
}
function abrirDrawerFolha(kind) {
  garantirOverlaysFolha();
  const header = document.getElementById('folha-drawer-header-content');
  const body = document.getElementById('folha-drawer-body');
  const footer = document.getElementById('folha-drawer-footer');

  if (kind === 'trocar-empresa') {
    header.innerHTML = `<div class="drawer-title">Trocar empresa</div>`;
    body.innerHTML = `<div class="ef-field"><label class="ef-label">Empresa</label><select class="ef-select" id="fd-trocar-empresa-folha">${Object.values(EMPRESAS_FOLHA).map((emp) => `<option value="${emp.codigo}" ${emp.codigo === empresaAtualFolha ? 'selected' : ''}>${emp.razaoSocial} — ${emp.codigo}</option>`).join('')}</select></div>`;
    footer.innerHTML = `<button class="btn btn-secondary" onclick="fecharDrawerFolha()">Cancelar</button><button class="btn btn-primary" onclick="confirmarTrocaEmpresaFolha()">Trocar empresa</button>`;
  }
  if (kind === 'vigencia-historico') {
    header.innerHTML = `<div class="drawer-title">Histórico de vigências</div><div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">Selecione um período para consultar em modo somente leitura. Regras de abertura, encerramento e critérios automáticos de nova vigência ainda não estão implementadas nesta etapa.</div>`;
    const vigs = dadosFolha.regime.vigencias;
    const atual = vigs.find((v) => !v.dataFim) || vigs[0];
    body.innerHTML = `<div class="fl-vt">${vigs.map((v) => {
      const isCurrent = !v.dataFim;
      const isSelected = (vigenciaSelecionadaFolha || atual.id) === v.id;
      return `<div class="fl-vt-item${isSelected ? ' is-current' : ''}" onclick="selecionarVigenciaFolha('${v.id}')">
        <div style="flex:1;"><div style="font-size:13px; font-weight:600; color:var(--text-primary);">${v.dataFim ? v.dataInicio + ' – ' + v.dataFim : 'desde ' + v.dataInicio}</div><div class="fl-vt-meta">${v.tipoEstabelecimento}</div></div>
        <span class="badge ${isCurrent ? 'badge-success' : 'badge-neutral'}">${isCurrent ? 'Atual' : 'Encerrada'}</span>
      </div>`;
    }).join('')}</div>`;
    footer.innerHTML = `<button class="btn btn-secondary" onclick="fecharDrawerFolha()">Fechar</button><button class="btn btn-primary" disabled title="Regra de abertura de nova vigência ainda não definida">Iniciar nova vigência</button>`;
  }
  document.getElementById('folha-drawer-overlay').classList.add('open');
  document.getElementById('folha-drawer').classList.add('open');
  refreshIcons();
}
function fecharDrawerFolha() { document.getElementById('folha-drawer-overlay').classList.remove('open'); document.getElementById('folha-drawer').classList.remove('open'); }
function selecionarVigenciaFolha(id) {
  const vigs = dadosFolha.regime.vigencias;
  const atual = vigs.find((v) => !v.dataFim) || vigs[0];
  vigenciaSelecionadaFolha = id === atual.id ? null : id;
  fecharDrawerFolha();
  renderTabContentFolha();
}
function confirmarTrocaEmpresaFolha() {
  const codigo = document.getElementById('fd-trocar-empresa-folha').value;
  empresaAtualFolha = codigo;
  abaAtivaFolha = 'geral';
  inicializarDadosEmpresaFolha(codigo);
  fecharDrawerFolha();
  renderShellFolha();
  showToastFolha('Empresa alterada', `Exibindo folha de pagamento de ${EMPRESAS_FOLHA[codigo].razaoSocial}.`);
}

function showToastFolha(title, desc) {
  let wrap = document.getElementById('fl-toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.className = 'fl-toast-wrap'; wrap.id = 'fl-toast-wrap'; document.body.appendChild(wrap); }
  const el = document.createElement('div');
  el.className = 'fl-toast';
  el.innerHTML = `<i data-lucide="check-circle-2" style="color:var(--success); width:18px; height:18px; flex-shrink:0;"></i><div><div style="font-weight:600;">${title}</div><div style="color:var(--text-secondary); font-size:12px; margin-top:2px;">${desc}</div></div>`;
  wrap.appendChild(el);
  refreshIcons();
  setTimeout(() => el.remove(), 5000);
}

renderShellFolha();
</script>
