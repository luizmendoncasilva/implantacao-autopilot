<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>Sindicatos · Autopilot Configs</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--surface-muted); }
  .sd-wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 20px; }
  .sd-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sd-title { font-size: 20px; font-weight: 700; color: var(--text-primary); margin: 0 0 4px; }
  .sd-desc { font-size: 13px; color: var(--text-secondary); max-width: 560px; margin: 0; line-height: 1.5; }
  .sd-field { display: flex; flex-direction: column; gap: 4px; }
  .sd-field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .sd-field input {
    height: 36px; width: 300px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font-size: 13px;
    font-family: 'Inter', sans-serif; background: var(--surface); color: var(--text-primary);
  }
  .sd-field input:focus { outline: none; border-color: var(--brand-pink); }
  .sd-mono { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
</style>
</head>
<body>

<div class="sd-wrap">
  <div class="sd-head">
    <div>
      <h1 class="sd-title">Sindicatos</h1>
      <p class="sd-desc">Cadastro das entidades sindicais e das convenções coletivas de trabalho vinculadas a cada uma.</p>
    </div>
    <button type="button" class="btn btn-primary" id="btn-novo-sindicato"><i data-lucide="plus" style="width:14px;height:14px"></i> Novo sindicato</button>
  </div>

  <div class="section-card" style="padding:16px 18px;">
    <div class="sd-field">
      <label>Pesquisar</label>
      <input id="f-busca" placeholder="Pesquisar por nome" />
    </div>
  </div>

  <div class="section-card" style="padding:0;">
    <div id="dt-sindicatos"></div>
  </div>
</div>

<script>
window.FLOW_CONFIG = { standalone: true };

// Mock — mesmo catálogo de sindicatos do protótipo original (sindicatos/js/data.js).
const SINDICATOS_MOCK = [
  { codigo: "SIND-0001", nome: "Sindicato dos Empregados no Comércio de Goiânia", cnpj: "01.234.567/0001-89", tipoEntidade: "Sindicato", cidade: "Goiânia", uf: "GO" },
  { codigo: "SIND-0002", nome: "Sindicato dos Trabalhadores nas Indústrias Metalúrgicas de Goiânia", cnpj: "02.345.678/0001-70", tipoEntidade: "Sindicato", cidade: "Goiânia", uf: "GO" },
  { codigo: "SIND-0003", nome: "Federação dos Professores do Estado de Goiás", cnpj: "03.456.789/0001-61", tipoEntidade: "Federação", cidade: "Goiânia", uf: "GO" },
];

function abrirSindicato(codigo) {
  window.location.href = "sindicato.html?sindicato=" + encodeURIComponent(codigo);
}

function aplicarFiltroSindicatos() {
  const busca = document.getElementById("f-busca").value.trim().toLowerCase();
  const filtrados = SINDICATOS_MOCK.filter((s) => !busca || s.nome.toLowerCase().includes(busca));
  dtSetRows('sindicatos', filtrados);
}

document.getElementById("btn-novo-sindicato").addEventListener("click", () => (window.location.href = "sindicato.html"));
document.getElementById("f-busca").addEventListener("input", aplicarFiltroSindicatos);
</script>
<script src="../assets/core/cockpit-01-shell.js"></script>
<script src="../assets/core/cockpit-02-state-helpers.js"></script>
<script src="../assets/core/cockpit-08-datatable.js"></script>
<script src="../assets/core/cockpit-07-modals-init.js"></script>
<script src="../assets/core/cockpit-09-cx-sidebar.js"></script>
<script>
dtCreate('sindicatos', {
  columns: [
    { key: 'codigo', label: 'Código', sortable: true, render: (row) => '<span class="sd-mono">' + row.codigo + '</span>' },
    { key: 'nome', label: 'Sindicato', sortable: true },
    { key: 'cnpj', label: 'CNPJ', mono: true },
    { key: 'tipoEntidade', label: 'Tipo da entidade' },
    { key: 'cidade', label: 'Cidade/UF', render: (row) => row.cidade + '/' + row.uf },
  ],
  rows: SINDICATOS_MOCK,
  rowKey: 'codigo',
  pageSize: 25,
  searchable: false,
  onRowClick: (row) => abrirSindicato(row.codigo),
  emptyMessage: 'Nenhum sindicato encontrado para a busca informada.',
});
refreshIcons();
</script>
</body>
</html>
